<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GoPanel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231aa34a'/%3E%3Cpath d='M9 23V9h13v3H13v3h7v3h-7v2h9v3z' fill='white'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint to avoid a light/dark flash.
  try {
    var pref = localStorage.getItem('gopanel.theme') || 'system';
    var dark = pref === 'dark' || (pref === 'system'
      && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) { /* ignore */ }
</script>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="app">
  <div class="boot-screen">
    <div class="boot-logo">G</div>
    <div class="boot-name">GoPanel</div>
    <div class="boot-bar"><span></span></div>
  </div>
</div>
<noscript><div class="noscript">GoPanel requires JavaScript to run.</div></noscript>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
